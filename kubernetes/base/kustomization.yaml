apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - mysql_config.yaml
  - mysql_secret.yaml
  - mysql_deploy.yaml
  - webapp.yaml

images:
  - name: webapp-image
    newName: joeljozarackal/flask-k8s
    newTag: v4mysqldb

patches:
  - target:
      kind: Deployment
      name: webapp-deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: API_URL
          value: "https://hacker-news.firebaseio.com/v0/item/8863.json"