version: 2.1

jobs:
  
  run_script:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: "Run Deploy Script"
          working_directory: scripts
          command: |
            python3 src/{{ script }}

  test_container:
    parameters:
      image_tag:
        type: string
    docker:
      - image: joeljozarackal/flask_app:<< parameters.image_tag >>
    steps:
      - run:
          name: "Testing Container"
          command: |
            pwd
            hostname
            ls
            ls -a
            ls -la /app
            
            


workflows:
  deployment-workflow:
    jobs:
      - run_script
      - test_container:
          name: Test Container
          image_tag: v2