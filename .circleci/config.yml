version: 2.1

setup: true

orbs:
  continuation: circleci/continuation@0.3.1

jobs:
  say-hello:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Say hello"
          command: |
            echo Hello, World!
            echo $CIRCLE_SHA1
    
  dynamic_ci:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install script dependencies
          working_directory: scripts
          command: poetry install --no-ansi --sync
      - run:
          name: "Run Dynamic CI Script"
          working_directory: scripts
          command: |
            poetry run python -m src.dynamic_ci
            cat ./dynamic_ci.yaml
      - continuation/continue:
          configuration_path: ./scripts/dynamic_ci.yaml


workflows:
  say-hello-workflow:
    jobs:
      - say-hello
      - dynamic_ci
